<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataChats</title>
<script src="https://unpkg.com/appwrite@16.0.2/dist/iife/appwrite.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;height:100vh;display:flex;flex-direction:column}.topbar{background:#202c3b;color:#fff;padding:12px 20px;font-size:20px;font-weight:bold;text-align:center}.app{flex:1;display:flex;min-height:0}.sidebar{width:280px;background:#202c3b;color:#fff;display:flex;flex-direction:column}.sidebar-header{padding:14px 16px;font-weight:bold;border-bottom:1px solid #33465d}.chat-list{flex:1;overflow-y:auto}.chat-item{padding:14px 16px;cursor:pointer;border-bottom:1px solid #2c3b4d}.chat-item:hover{background:#2c3b4d}.chat-item.active{background:#3b82f6}.sidebar-footer{padding:12px;display:flex;flex-direction:column;gap:8px}button{border:none;border-radius:8px;padding:10px;cursor:pointer;font-size:14px}.primary{background:#3b82f6;color:#fff}.secondary{background:#33465d;color:#fff}.main{flex:1;display:flex;flex-direction:column;min-width:0}.chat-header{background:#fff;padding:14px 20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:10px}.messages{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}.message{max-width:75%;padding:10px 14px;border-radius:14px;background:#fff;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.08);word-wrap:break-word}.message.own{background:#3b82f6;color:#fff;align-self:flex-end}.message .author{font-size:12px;opacity:.8;margin-bottom:4px}.message .delete{margin-left:8px;background:transparent;color:inherit;cursor:pointer;font-size:12px;padding:0}.composer{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #ddd}input{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:14px;width:100%}.composer input{flex:1}.empty{margin:auto;color:#667;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10}.modal.open{display:flex}.modal-box{background:#fff;padding:20px;border-radius:12px;width:min(380px,92vw);display:flex;flex-direction:column;gap:10px}.auth-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}.auth-box{background:#fff;padding:24px;border-radius:14px;width:min(380px,94vw);display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.08)}.hidden{display:none!important}
</style>
</head>
<body>

<div class="topbar">DataChats</div>

<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h2 style="margin:0">Вход в DataChats</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">
    <button class="primary" onclick="login()">Войти</button>
    <button class="secondary" onclick="register()">Зарегистрироваться</button>
    <button class="secondary" onclick="guestLogin()">Войти как гость</button>
  </div>
</div>

<div class="app hidden" id="appScreen">
  <aside class="sidebar">
    <div class="sidebar-header">Мои чаты</div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">
      <button class="primary" onclick="openModal('createModal')">Создать чат</button>
      <button class="secondary" id="joinByCodeBtn" onclick="openModal('joinByCodeModal')">Гостю: войти по коду</button>
      <button class="secondary" id="joinByIdBtn" onclick="openModal('joinByIdModal')">Аккаунту: войти по ID чата</button>
      <button class="secondary" onclick="logout()">Выйти</button>
    </div>
  </aside>

  <main class="main">
    <div class="chat-header">
      <div id="chatTitle">Выберите чат</div>
      <button class="secondary" id="inviteBtn" onclick="openModal('inviteModal')" style="display:none">Приглашение</button>
    </div>

    <div class="messages" id="messages"><div class="empty">Выберите чат слева</div></div>

    <div class="composer hidden" id="composer">
      <input id="textInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="primary" onclick="sendMessage()">Отправить</button>
    </div>
  </main>
</div>

<div class="modal" id="createModal"><div class="modal-box"><h3>Новый чат</h3><input id="newChatTitle" placeholder="Название чата"><button class="primary" onclick="createChat()">Создать</button><button class="secondary" onclick="closeModals()">Отмена</button></div></div>

<div class="modal" id="joinByCodeModal"><div class="modal-box"><h3>Вход по коду приглашения</h3><input id="inviteInput" placeholder="Код приглашения"><button class="primary" onclick="joinByCode()">Войти</button><button class="secondary" onclick="closeModals()">Отмена</button></div></div>

<div class="modal" id="joinByIdModal"><div class="modal-box"><h3>Вход по ID чата</h3><input id="chatIdInput" placeholder="ID чата"><button class="primary" onclick="joinById()">Войти</button><button class="secondary" onclick="closeModals()">Отмена</button></div></div>

<div class="modal" id="inviteModal"><div class="modal-box"><h3>Код приглашения</h3><input id="inviteCode" readonly><button class="primary" onclick="copyInvite()">Скопировать</button><button class="secondary" onclick="closeModals()">Закрыть</button></div></div>

<script>
const AppwriteSDK = Appwrite;
const { Client, Databases, Account, ID, Query } = AppwriteSDK;

const dataChatsClient = new Client()
  .setEndpoint('https://cloud.appwrite.io/v1')
  .setProject('6ad4dbfb00355225f62d');

const dataChatsDatabases = new Databases(dataChatsClient);
const dataChatsAccount = new Account(dataChatsClient);

const DATABASE_ID = 'messenger';
const CHATS_COLLECTION = 'chats';
const MESSAGES_COLLECTION = 'messages';

let currentUser = null;
let isGuest = false;
let currentChat = null;
let chats = [];

async function init() {
  try {
    currentUser = await dataChatsAccount.get();
    isGuest = false;
    showApp();
    await loadChats();
  } catch (e) {
    showAuth();
  }
}

function showAuth() {
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('hidden');
}

function showApp() {
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('joinByIdBtn').style.display = isGuest ? 'none' : 'block';
  document.getElementById('joinByCodeBtn').style.display = isGuest ? 'block' : 'none';
}

async function register() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || password.length < 8) {
    return alert('Введите email и пароль минимум из 8 символов');
  }

  try {
    await dataChatsAccount.create(ID.unique(), email, password, email.split('@')[0]);
    await dataChatsAccount.createEmailPasswordSession(email, password);
    currentUser = await dataChatsAccount.get();
    isGuest = false;
    showApp();
    await loadChats();
  } catch (e) {
    alert('Ошибка регистрации: ' + e.message);
  }
}

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    await dataChatsAccount.createEmailPasswordSession(email, password);
    currentUser = await dataChatsAccount.get();
    isGuest = false;
    showApp();
    await loadChats();
  } catch (e) {
    alert('Ошибка входа: ' + e.message);
  }
}

async function guestLogin() {
  try {
    await dataChatsAccount.createAnonymousSession();
    currentUser = await dataChatsAccount.get();
    isGuest = true;
    showApp();
    await loadChats();
  } catch (e) {
    alert('Ошибка гостевого входа: ' + e.message);
  }
}

async function logout() {
  try {
    await dataChatsAccount.deleteSession('current');
  } catch (e) {}
  location.reload();
}

async function loadChats() {
  const res = await dataChatsDatabases.listDocuments(
    DATABASE_ID,
    CHATS_COLLECTION,
    [Query.contains('memberIds', currentUser.$id)]
  );

  chats = res.documents;
  renderChats();
}

function renderChats() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';

  if (!chats.length) {
    list.innerHTML = '<div style="padding:16px;color:#9fb0c3">Чатов пока нет</div>';
    return;
  }

  chats.forEach(chat => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (currentChat && currentChat.$id === chat.$id ? ' active' : '');
    div.textContent = chat.title;
    div.onclick = () => openChat(chat);
    list.appendChild(div);
  });
}

async function createChat() {
  const title = document.getElementById('newChatTitle').value.trim();
  if (!title) return alert('Введите название чата');

  const inviteCode = Math.random().toString(36).slice(2, 10).toUpperCase();

  try {
    const chat = await dataChatsDatabases.createDocument(
      DATABASE_ID,
      CHATS_COLLECTION,
      ID.unique(),
      {
        title,
        inviteCode,
        ownerId: currentUser.$id,
        memberIds: [currentUser.$id],
        allowedUserIds: isGuest ? [] : [currentUser.$id]
      }
    );

    document.getElementById('newChatTitle').value = '';
    closeModals();
    await loadChats();
    openChat(chat);
  } catch (e) {
    alert('Ошибка создания чата: ' + e.message);
  }
}

async function joinByCode() {
  const code = document.getElementById('inviteInput').value.trim().toUpperCase();
  if (!code) return;

  try {
    const res = await dataChatsDatabases.listDocuments(
      DATABASE_ID,
      CHATS_COLLECTION,
      [Query.equal('inviteCode', code)]
    );

    if (!res.documents.length) {
      return alert('Чат с таким кодом не найден');
    }

    const chat = res.documents[0];

    if (!chat.memberIds.includes(currentUser.$id)) {
      await dataChatsDatabases.updateDocument(
        DATABASE_ID,
        CHATS_COLLECTION,
        chat.$id,
        { memberIds: [...chat.memberIds, currentUser.$id] }
      );
    }

    document.getElementById('inviteInput').value = '';
    closeModals();
    await loadChats();
    openChat(chat);
  } catch (e) {
    alert('Ошибка входа по коду: ' + e.message);
  }
}

async function joinById() {
  if (isGuest) {
    return alert('Гость может входить только по коду приглашения');
  }

  const chatId = document.getElementById('chatIdInput').value.trim();
  if (!chatId) return;

  try {
    const chat = await dataChatsDatabases.getDocument(
      DATABASE_ID,
      CHATS_COLLECTION,
      chatId
    );

    const allowed =
      chat.allowedUserIds.includes(currentUser.$id) ||
      chat.memberIds.includes(currentUser.$id);

    if (!allowed) {
      return alert('Вас не добавили в этот чат');
    }

    if (!chat.memberIds.includes(currentUser.$id)) {
      await dataChatsDatabases.updateDocument(
        DATABASE_ID,
        CHATS_COLLECTION,
        chat.$id,
        { memberIds: [...chat.memberIds, currentUser.$id] }
      );
    }

    document.getElementById('chatIdInput').value = '';
    closeModals();
    await loadChats();
    openChat(chat);
  } catch (e) {
    alert('Чат не найден или нет доступа');
  }
}

async function openChat(chat) {
  currentChat = chat;
  renderChats();

  document.getElementById('chatTitle').textContent = chat.title;
  document.getElementById('inviteBtn').style.display = 'block';
  document.getElementById('composer').classList.remove('hidden');
  document.getElementById('inviteCode').value = chat.inviteCode;

  await loadMessages();
}

async function loadMessages() {
  if (!currentChat) return;

  const res = await dataChatsDatabases.listDocuments(
    DATABASE_ID,
    MESSAGES_COLLECTION,
    [
      Query.equal('roomId', currentChat.$id),
      Query.orderAsc('$createdAt'),
      Query.limit(100)
    ]
  );

  const box = document.getElementById('messages');
  box.innerHTML = '';

  res.documents.forEach(msg => {
    const div = document.createElement('div');
    div.className = 'message' + (msg.senderId === currentUser.$id ? ' own' : '');

    const author = document.createElement('div');
    author.className = 'author';
    author.textContent = msg.senderId === currentUser.$id
      ? 'Вы'
      : (msg.senderName || 'Гость');
    div.appendChild(author);

    const text = document.createElement('div');
    text.textContent = msg.text;
    div.appendChild(text);

    if (msg.senderId === currentUser.$id) {
      const del = document.createElement('button');
      del.className = 'delete';
      del.textContent = 'Удалить';
      del.onclick = () => deleteMessage(msg.$id);
      div.appendChild(del);
    }

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('textInput');
  const text = input.value.trim();

  if (!text || !currentChat) return;

  try {
    await dataChatsDatabases.createDocument(
      DATABASE_ID,
      MESSAGES_COLLECTION,
      ID.unique(),
      {
        roomId: currentChat.$id,
        senderId: currentUser.$id,
        senderName: isGuest
          ? 'Гость ' + currentUser.$id.slice(0, 5)
          : (currentUser.name || currentUser.email.split('@')[0]),
        text
      }
    );

    input.value = '';
    await loadMessages();
  } catch (e) {
    alert('Ошибка отправки: ' + e.message);
  }
}

async function deleteMessage(id) {
  if (!confirm('Удалить это сообщение?')) return;

  try {
    await dataChatsDatabases.deleteDocument(
      DATABASE_ID,
      MESSAGES_COLLECTION,
      id
    );
    await loadMessages();
  } catch (e) {
    alert('Не удалось удалить сообщение');
  }
}

function openModal(id) {
  document.getElementById(id).classList.add('open');
}

function closeModals() {
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
}

function showInvite() {
  openModal('inviteModal');
}

function copyInvite() {
  navigator.clipboard.writeText(document.getElementById('inviteCode').value);
  alert('Код скопирован');
}

init();
</script>
</body>
</html>
